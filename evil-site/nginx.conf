log_format lab_auth '$remote_addr [$time_local] "$request" $status '
                    'Authorization="$http_authorization"';

server {
    # Этап 2: HTTP.
    listen 192.168.50.1:80;

    # Этапы 4–5: закомментировать listen выше и включить эти строки.
    # listen 192.168.50.1:443 ssl;
    # ssl_certificate /etc/nginx/ssl/lab/evil.crt;
    # ssl_certificate_key /etc/nginx/ssl/lab/evil.key;

    server_name portal.corp.local;
    access_log /var/log/nginx/lab-auth.log lab_auth;

    location / {
        # Этап 2: настоящий сайт ещё работает по HTTP.
        proxy_pass http://192.168.50.10;

        # Этапы 4–5: закомментировать proxy_pass выше, включить блок ниже.
        # proxy_pass https://192.168.50.10;
        # proxy_ssl_server_name on;
        # proxy_ssl_name portal.corp.local;
        # proxy_ssl_verify on;
        # proxy_ssl_verify_depth 2;
        # proxy_ssl_trusted_certificate /etc/nginx/ssl/lab/valid-rootCA.pem;

        proxy_set_header Host portal.corp.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
}
