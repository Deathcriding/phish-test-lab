# Фрагмент для /etc/nginx/sites-available/site, внутри стандартного http {}.
server {
    # Этапы 1–2: HTTP.
    listen 80;

    # Этапы 3–5: закомментировать listen 80 и включить эти строки.
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/ssl/lab/legit.crt;
    # ssl_certificate_key /etc/nginx/ssl/lab/legit.key;

    server_name portal.corp.local;
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    root /var/www/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
