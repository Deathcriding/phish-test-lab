no-resolv
server=1.1.1.1
server=8.8.8.8
interface=eth1
bind-interfaces
domain=corp.local
expand-hosts
local=/corp.local/

# Этапы 1 и 3: настоящий сайт. Активна только одна из двух строк.
address=/portal.corp.local/192.168.50.10
# Этапы 2, 4 и 5: поддельный портал на Kali.
# address=/portal.corp.local/192.168.50.1

dhcp-range=192.168.50.100,192.168.50.115,255.255.255.0,12h
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1
dhcp-option=15,corp.local
